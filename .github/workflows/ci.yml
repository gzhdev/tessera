# Tessera 持续集成（core-workspace-bootstrap 任务 3.3）
#
# 设计原则（design.md Non-Goals）：不追求完备性（覆盖率、跨平台矩阵），
# 只保内核质量门禁（fmt / clippy / test）、生成物一致性校验、依赖方向
# 检查与 WASM 工具链冒烟——各步骤以 job 内清单为准，此处不逐一列举。
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust 质量门禁（fmt / clippy / test / 生成物一致性 / 依赖方向）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装 Tauri 系统依赖（src-tauri 构建需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

      - name: schema 生成物一致性（§4.3：plugin.schema.json 从类型生成，禁止手改）
        run: |
          cargo run -p tessera-manifest --bin gen-schema
          git diff --exit-code -- crates/tessera-manifest/schema/

      - name: UI 类型生成物一致性（§17.2：types/generated 从 Rust 类型生成，禁止手改）
        run: |
          cargo run -p tessera-ui-schema --bin gen-types
          git diff --exit-code -- src/types/generated/

      - name: 依赖方向硬性检查（§17.1 约束 1/2）
        run: bash scripts/check-deps.sh

      - name: 日志子系统无网络出口检查
        run: bash scripts/check-log-no-network.sh

  frontend-checks:
    name: 前端质量门禁（vue-tsc 类型检查 / Vitest 组件测试）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # §17.1 约束 5：前端不本地修补生成类型——types/generated 由 Rust 侧
      # gen-types 产出（rust-checks 已校验逐字节一致），此处直接消费。
      - name: 类型检查（vue-tsc）
        run: npx vue-tsc --noEmit

      - name: 组件测试（Vitest，fixture 驱动）
        run: npx vitest run

  toolchain-smoke:
    name: WASM Component Model 工具链冒烟
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 与 wasm32-wasip2 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: 安装 wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.257.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/toolchain-roundtrip

      - name: 往返用例（guest 构建 → component 反解 → host 实例化回调）
        working-directory: examples/toolchain-roundtrip
        run: |
          cargo build -p roundtrip-guest --target wasm32-wasip2
          wasm-tools component wit target/wasm32-wasip2/debug/roundtrip_guest.wasm | grep -F "import host-tag: func(name: string) -> string;"
          wasm-tools component wit target/wasm32-wasip2/debug/roundtrip_guest.wasm | grep -F "export plugin-run: func(input: string) -> string;"
          cargo test -p roundtrip-host -- --nocapture
