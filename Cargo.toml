[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
exclude = ["examples/toolchain-roundtrip"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
ts-rs = "12"

[profile.release]
lto = true
