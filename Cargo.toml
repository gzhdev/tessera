[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
exclude = ["examples/toolchain-roundtrip"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

[profile.release]
lto = true
